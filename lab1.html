<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Activity 1 – Simple Carousel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0eaff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .card {
            max-width: 700px;
            width: 100%;
            background: white;
            border-radius: 2rem;
            padding: 2rem 1.5rem 2.5rem 1.5rem;
            box-shadow: 0 15px 30px #b9a6dd;
            text-align: center;
        }

        h2 {
            color: #2c2152;
            margin-bottom: 1.8rem;
            font-weight: 500;
            font-size: 2rem;
        }

        /* ---- VIEWPORT (only one slide visible at a time) ---- */
        .carousel-viewport {
            overflow: hidden;
            border-radius: 1.5rem;
            border: 3px solid white;
            box-shadow: 0 8px 12px #9d87cf;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.4s ease;
        }

        .carousel-item {
            flex: 0 0 100%;
            height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 2.8rem;
            font-weight: bold;
            color: white;
        }

        .carousel-item span.label {
            font-size: 1rem;
            font-weight: normal;
            opacity: 0.9;
        }

        /* individual slide colors */
        .carousel-item:nth-child(1) { background: #7a62b5; }
        .carousel-item:nth-child(2) { background: #5da887; }
        .carousel-item:nth-child(3) { background: #c2704a; }
        .carousel-item:nth-child(4) { background: #3e8bb5; }
        .carousel-item:nth-child(5) { background: #b08030; }
        .carousel-item:nth-child(6) { background: #b55680; }

        /* ---- NUMBER BUTTONS ---- */
        .btn-row {
            display: flex;
            justify-content: center;
            gap: 0.7rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .btn-num {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #a58bd4;
            background: white;
            color: #4a3977;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, transform 0.1s;
        }

        .btn-num:hover {
            background: #eee5ff;
        }

        .btn-num.active {
            background: #7a62b5;
            color: white;
            border-color: #7a62b5;
            transform: scale(1.1);
        }

        /* ---- PREV / NEXT ---- */
        .nav-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.2rem;
        }

        .btn-nav {
            background: #eee5ff;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 3rem;
            color: #4a3977;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-nav:hover {
            background: #d9c8f7;
        }

        .counter {
            color: #7a62b5;
            font-size: 0.95rem;
        }

        .note {
            margin-top: 1.5rem;
            color: #4a3977;
            background: #eee5ff;
            padding: 0.8rem 1.2rem;
            border-radius: 3rem;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>🖼️ Lab Activity 1 – Simple Carousel</h2>

        <!-- VIEWPORT -->
        <div class="carousel-viewport">
            <div class="carousel-track" id="track">
                <div class="carousel-item">
    <img src="photo1.jpg" alt="Slide 1" style="width:100%; height:100%; object-fit:cover;">
</div>
<div class="carousel-item">
    <img src="photo2.jpg" alt="Slide 2" style="width:100%; height:100%; object-fit:cover;">
</div>
<div class="carousel-item">
    <img src="photo3.jpg" alt="Slide 3" style="width:100%; height:100%; object-fit:cover;">
</div>
<div class="carousel-item">
    <img src="photo4.jpg" alt="Slide 4" style="width:100%; height:100%; object-fit:cover;">
</div>
<div class="carousel-item">
    <img src="photo5.jpg" alt="Slide 5" style="width:100%; height:100%; object-fit:cover;">
</div>
<div class="carousel-item">
    <img src="photo6.jpg" alt="Slide 6" style="width:100%; height:100%; object-fit:cover;">
</div>
            </div>
        </div>

        <!-- NUMBERED BUTTONS -->
        <div class="btn-row" id="btn-row"></div>

        <!-- PREV / NEXT + COUNTER -->
        <div class="nav-row">
            <button class="btn-nav" id="prev">← Prev</button>
            <span class="counter" id="counter">Slide 1 of 6</span>
            <button class="btn-nav" id="next">Next →</button>
        </div>

        <div class="note">
            Click a number button to jump to that slide &nbsp;·&nbsp; or use Prev / Next
        </div>
    </div>

    <script>
        const track = document.getElementById('track');
        const btnRow = document.getElementById('btn-row');
        const counter = document.getElementById('counter');
        const total = 6;
        let current = 0;

        function goTo(n) {
            current = n;
            track.style.transform = 'translateX(-' + (100 * current) + '%)';
            counter.textContent = 'Slide ' + (current + 1) + ' of ' + total;
            document.querySelectorAll('.btn-num').forEach(function(btn, i) {
                btn.classList.toggle('active', i === current);
            });
        }

        // Build number buttons 1–6
        for (let i = 0; i < total; i++) {
            const btn = document.createElement('button');
            btn.className = 'btn-num' + (i === 0 ? ' active' : '');
            btn.textContent = i + 1;
            btn.addEventListener('click', function() { goTo(i); });
            btnRow.appendChild(btn);
        }

        document.getElementById('prev').addEventListener('click', function() {
            goTo((current - 1 + total) % total);
        });

        document.getElementById('next').addEventListener('click', function() {
            goTo((current + 1) % total);
        });
    </script>
</body>
</html>
